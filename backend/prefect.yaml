name: diarco_pdd_flows
prefect-version: 3.6.21

work_pool:
  name: diarco-pdd
  work_queue_name: pdd
  job_variables: {}

deployments:
  - name: PDD_SCOPE_SNAPSHOT_MANUAL
    entrypoint: pdd_backend/flows/analytical.py:pdd_scope_snapshot_flow
    parameters: {}
    work_pool:
      name: diarco-pdd
      work_queue_name: pdd

  - name: PDD_ANALYTICAL_DAILY_PROD
    entrypoint: pdd_backend/flows/analytical.py:pdd_daily_flow
    parameters: {}
    work_pool:
      name: diarco-pdd
      work_queue_name: pdd

  - name: PDD_INITIAL_BACKFILL_MANUAL
    entrypoint: pdd_backend/flows/analytical.py:pdd_initial_backfill_flow
    parameters: {}
    work_pool:
      name: diarco-pdd
      work_queue_name: pdd

  - name: PDD_BACKTEST_MANUAL
    entrypoint: pdd_backend/flows/analytical.py:pdd_backtest_flow
    parameters: {}
    work_pool:
      name: diarco-pdd
      work_queue_name: pdd

  - name: PDD_ROLLING_BACKTEST_MANUAL
    entrypoint: pdd_backend/flows/backtest.py:pdd_rolling_backtest_flow
    parameters: {}
    work_pool:
      name: diarco-pdd
      work_queue_name: pdd
