[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diarco-pdd-backend"
version = "0.13.1"
description = "Procesos analiticos PDD sobre diarco_data orquestados con Prefect"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "prefect>=3.4,<4",
    "fastapi>=0.115,<0.120",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.34,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[project.scripts]
pdd-etl = "pdd_backend.cli:main"
pdd-api = "pdd_backend.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdd_backend*"]

[tool.setuptools.package-data]
pdd_backend = ["sql/**/*.sql", "rules/*.json", "manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
