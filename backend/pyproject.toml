[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diarco-pdd-backend"
version = "0.1.0"
description = "Procesos analiticos PDD sobre diarco_data orquestados con Prefect"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "prefect>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pdd-etl = "pdd_backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdd_backend*"]

[tool.setuptools.package-data]
pdd_backend = ["sql/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

