components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Adaptar al mecanismo autenticado existente de CONNEXA; no introducir
        autenticaci?n paralela.
  parameters:
    Domain:
      name: domain
      in: path
      required: true
      schema:
        type: string
      description: Dominio autorizado; DEFAULT para la instalaci?n actual.
    VersionId:
      name: versionId
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: *id002
    ValidationId:
      name: validationId
      in: path
      required: true
      schema: *id002
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"1"'
      description: Revisi?n de la versi?n, no de la regla.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id002
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: *id002
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        requestId: *id001
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: *id001
              message: *id001
            required:
            - field
            - message
      required:
      - code
      - message
      - requestId
    Days:
      type: string
      pattern: ^(0|[1-9][0-9]{0,5})(\.[0-9]{1,4})?$
      example: '15.0000'
      description: Decimal exacto, sin exponente; de 0 a 999999.9999.
    VersionInput:
      type: object
      additionalProperties: false
      properties:
        baseVersionId: &id006
          type: string
          format: uuid
          nullable: true
        changeReason: &id003
          type: string
          minLength: 1
        validFrom: &id004
          type: string
          format: date
          nullable: true
        validTo: &id005
          type: string
          format: date
          nullable: true
      required:
      - changeReason
    HeaderInput:
      type: object
      additionalProperties: false
      properties:
        changeReason: *id003
        validFrom: *id004
        validTo: *id005
      required:
      - changeReason
      - validFrom
