scope_version:
  scope_version_uuid: "96a3775e-de50-4bac-919f-95132ad195d9"
  scope_code: "CD41_DISTRIBUTABLE_ASSORTMENT"
  version_no: 1
  status: "APPROVED"
  origin_cd: 41
  business_date: "2026-08-03"
  source:
    database: "diarco_data"
    relation: "src.base_productos_vigentes"
    source_as_of_ts: "2026-08-03T13:46:39.101840"

  approval:
    decision_reference: "PDD - ADR-001 Universo Distribuible CD41.md"
    confirmed_at: "2026-08-02"
    confirmed_by_role: "responsable_funcional"
    confirmed_by_identifier: "PENDING_FORMAL_REGISTRATION"
    evidence: >-
      Confirmacion explicita del filtro normativo durante la definicion del
      proyecto. Antes de insertar el registro APPROVED en
      connexa_platform_ms debe reemplazarse el identificador pendiente por el
      usuario corporativo correspondiente.

  article_filter:
    description: "Articulos habilitados para compra en CD 41"
    predicates:
      c_sucu_empr: 41
      active_for_purchase: 1
    sql: |-
      SELECT DISTINCT c_articulo
      FROM src.base_productos_vigentes
      WHERE c_sucu_empr = 41
        AND active_for_purchase = 1

  pair_filter:
    description: "Pares articulo-sucursal distribuidos desde CD 41"
    requires_article_membership: true
    excludes_origin_as_destination: true
    predicates:
      cod_cd: "41CD"
      abastecimiento: 0
      habilitado: 1
      active_for_sale: 1
      active_on_mix: 1
    sql: |-
      SELECT DISTINCT
          bpv.c_articulo,
          bpv.c_sucu_empr AS destination_branch
      FROM src.base_productos_vigentes AS bpv
      INNER JOIN (
          SELECT DISTINCT c_articulo
          FROM src.base_productos_vigentes
          WHERE c_sucu_empr = 41
            AND active_for_purchase = 1
      ) AS cd_articles USING (c_articulo)
      WHERE bpv.cod_cd = '41CD'
        AND bpv.abastecimiento = 0
        AND bpv.habilitado = 1
        AND bpv.active_for_sale = 1
        AND bpv.active_on_mix = 1
        AND bpv.c_sucu_empr <> 41

  snapshot:
    article_count: 2908
    routed_article_count: 2231
    pair_count: 59031
    destination_count: 49
    checksum_algorithm: "SHA-256"
    canonicalization:
      encoding: "UTF-8"
      row_separator: "LF"
      field_separator: "|"
      article_order: ["codigo_articulo"]
      pair_order: ["destination_branch", "codigo_articulo"]
      null_representation: ""
    article_checksum: "38a30408a71e5ca607ae0646257e092ca992d76a0a81cf7895389db15d5d3a49"
    pair_checksum: "a6202b0b33353e491f0d8611627db0e2ef609e8432a077051998d89f16255cb9"
    scope_checksum: "7f85e68802278f26236740d5d133c6406b614c34c2455c9be388c8f0e92ee991"

  change_policy:
    reuse_uuid_when_checksum_unchanged: true
    create_new_version_when:
      - "article_checksum changes"
      - "pair_checksum changes"
      - "article or pair filter changes"
      - "origin CD changes"
    never_generate_per_run: true

model_version:
  model_version_uuid: "4bf8d74b-a3da-4385-af02-dccbbc055548"
  model_code: "PDVB_CD41"
  version_no: 1
  status: "DRAFT"
  approval_required_before_publication: true
  purpose: >-
    Estimar el Promedio Diario de Venta Basal por articulo-sucursal para las
    necesidades automaticas D y S de DECAS.

  parameters:
    cutoff_lag_days: 1
    windows:
      recent_days: 28
      previous_days: 28
      seasonal_days: 28
      seasonal_offset_years: 1
    weights:
      recent: "0.60"
      previous: "0.25"
      seasonal: "0.15"
      normalization: "AVAILABLE_WINDOWS"
    evidence:
      minimum_recent_eligible_days: 7
      minimum_total_eligible_days: 14
      warning_coverage: "0.70"
    availability:
      positive_stock_without_sale: "IN_STOCK_INCLUDE_ZERO"
      negative_or_zero_stock_without_sale: "OUT_OF_STOCK_EXCLUDE"
      missing_stock: "UNKNOWN_EXCLUDE"
      positive_sale_without_stock: "INFERRED_FROM_SALE_INCLUDE"
    promotions:
