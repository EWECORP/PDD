  article_filter:
    description: >-
      Articulos habilitados para compra en CD 41, excluyendo categorias de
      consumo interno sin ventas.
    predicates:
      c_sucu_empr: 41
      active_for_purchase: 1
    category_exclusion_policy:
      policy_code: "PDD_COMMERCIAL_DEMAND_EXCLUSIONS"
      version: 1
      rules:
        - rule_code: "INTERNAL_SUPPLIES_3818"
          c_rubro: 13
          rubro_name: "SIN CLASIFICAR"
          c_subrubro_1: 3818
          subrubro_1_name: "INSUMOS"
          reason: "NON_SALES_INTERNAL_CONSUMPTION"
        - rule_code: "INTERNAL_SUPPLIES_3838"
          c_rubro: 13
          rubro_name: "SIN CLASIFICAR"
          c_subrubro_1: 3838
          subrubro_1_name: "VARIOS"
          reason: "NON_SALES_INTERNAL_CONSUMPTION"
    sql: |-
      SELECT DISTINCT c_articulo
      FROM src.base_productos_vigentes
      WHERE c_sucu_empr = 41
        AND active_for_purchase = 1
        AND NOT EXISTS (
            SELECT 1
            FROM src.m_3_articulos AS art
            WHERE art.c_articulo = base_productos_vigentes.c_articulo
              AND art.c_rubro = 13
              AND art.c_subrubro_1 IN (3818, 3838)
        )

  pair_filter:
    description: "Pares articulo-sucursal distribuidos desde CD 41"
    requires_article_membership: true
    excludes_origin_as_destination: true
    predicates:
      cod_cd: "41CD"
      abastecimiento: 0
      habilitado: 1
      active_for_sale: 1
      active_on_mix: 1
    sql: |-
      SELECT DISTINCT
          bpv.c_articulo,
          bpv.c_sucu_empr AS destination_branch
      FROM src.base_productos_vigentes AS bpv
      INNER JOIN (
          SELECT DISTINCT c_articulo
          FROM src.base_productos_vigentes
          WHERE c_sucu_empr = 41
            AND active_for_purchase = 1
      ) AS cd_articles USING (c_articulo)
      WHERE bpv.cod_cd = '41CD'
        AND bpv.abastecimiento = 0
        AND bpv.habilitado = 1
        AND bpv.active_for_sale = 1
        AND bpv.active_on_mix = 1
        AND bpv.c_sucu_empr <> 41

